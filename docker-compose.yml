services:
  cvlab:
    container_name: "deindenbom-cvlab-train"
    build:
      context: .
      dockerfile: cvlab.dockerfile

    shm_size: "8gb"
    tty: true

    env_file:
      - .env

    volumes:
      - "${PWD}/data:/cvlab/data"
      - "${PWD}/checkpoints:/cvlab/checkpoints"
      - "${PWD}/logs:/cvlab/logs"

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    command: >
      python train.py
      --trainer ${METHOD}
      --name ${RUN_NAME}
      --epochs ${EPOCHS}
      --start_epoch ${START_EPOCH}
      --batch_size ${BATCH_SIZE}
      --learning_rate ${LEARNING_RATE}
      --workers ${WORKERS}
      --seed ${SEED}
      --checkpoint_interval ${CHECKPOINT_INTERVAL}
      --device ${DEVICE}
      --verbose

  tensorboard:
    container_name: "deindenbom-cvlab-tensorboard"
    build:
      context: .
      dockerfile: tensorboard.dockerfile

    ports:
      - "6006:6006"

    volumes:
      - "${PWD}/logs:/tensorboard/logs"

networks:
  default:
    name: "deindenbom-cvlab-train"
